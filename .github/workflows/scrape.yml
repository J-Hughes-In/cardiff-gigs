name: Scrape Cardiff Gigs

on:
  schedule:
    
    - cron: '3 4 * * *'
    - cron: '3 7 * * *'
    - cron: '3 10 * * *'
    - cron: '3 14 * * *'
    - cron: '3 19 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to scrape (leave blank to scrape all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Verify New Theatre scrape
        run: |
          node scrape.js --venue "New Theatre"
          node -e "
            const a = require('./events.json');
            const nt = a.filter(e => (e.venue||'').includes('New Theatre'));
            const d = nt.map(e => e.eventStartDate||'').filter(Boolean).sort();
            console.log('VERIFY New Theatre events:', nt.length);
            console.log('VERIFY date range:', d[0], '->', d[d.length-1]);
            console.log('VERIFY missing title:', nt.filter(e => !e.title).length);
            console.log('VERIFY missing date:', nt.filter(e => !e.date).length);
            console.log('VERIFY with availability:', nt.filter(e => e.availability).length);
            console.log('VERIFY sample:', JSON.stringify(nt.slice(0,3).map(e => ({t:e.title, d:e.date, c:e.category})), null, 1));
          "
