name: Scrape Cardiff Gigs

on:
  schedule:
    
    - cron: '3 4 * * *'
    - cron: '3 7 * * *'
    - cron: '3 10 * * *'
    - cron: '3 14 * * *'
    - cron: '3 19 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to scrape (leave blank to scrape all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Probe New Theatre listing
        run: node debug/probe-new-theatre.js
